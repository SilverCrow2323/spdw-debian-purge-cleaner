name: Purge Cleaner tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python package and tests
        run: python -m compileall -q spdw_purge tests
      - name: Run safety and core tests
        run: python -m unittest discover -s tests -v
