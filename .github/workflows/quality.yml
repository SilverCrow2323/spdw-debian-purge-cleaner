name: Quality checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: make test
      - name: Verify package metadata
        run: |
          python3 -m compileall -q spdw_purge tests
          test -x packaging/spdw-purge
